<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Comments — Downtown Donuts</title>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-seasalt">
  <header class="site-header">
    <div class="container header-inner">
      <img src="images/LightLogo.png" class="logo-main" alt="Downtown Donuts Logo">
      <a class="brand" href="index.html"><span class="brand-title">Downtown Donuts</span></a>
      <button class="nav-toggle" id="navToggle4" aria-expanded="false" aria-controls="mainNav4">☰</button>
      <nav id="mainNav4" class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="comments.html" class="active">Comments</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container comments-page">
    <h1>Customer Comments</h1>

    <section class="comment-form">
      <form id="commentForm" aria-label="Leave a comment">
        <label>
          Name
          <input id="name" name="name" type="text" placeholder="Your name" required>
        </label>

        <label>
          Comment
          <textarea id="message" name="message" rows="4" placeholder="Tell us what you think" required></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn primary">Post Comment</button>
          <button type="button" id="clearComments" class="btn outline">Clear All</button>
        </div>
      </form>
    </section>

    <section class="comments-list" aria-live="polite" id="commentsList">
      <!-- comments injected by JS -->
    </section>

    <p class="muted">Note: This demo stores comments in your browser only (localStorage). On production we would wire this to a secure API and moderation workflow.</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img src="images/DarkLogo.png" class="footer-logo" alt="Downtown Donuts Logo">
      <p>© <span id="year4"></span> Downtown Donuts</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
